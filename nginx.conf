server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ $uri.html =404;
  }

  # Hashed build output: safe to cache forever.
  location /_astro/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Unhashed public assets (favicons, manifest): short cache so updates land.
  location ~* \.(?:css|js|mjs|ico|gif|jpe?g|png|svg|webp|avif|woff2?)$ {
    expires 1d;
    add_header Cache-Control "public";
    try_files $uri =404;
  }
}
